<script>
document.addEventListener('DOMContentLoaded', function(){
/* =========================================================
   1. KONFIGURASI FIREBASE — GANTI DENGAN CONFIG PROYEK ANDA
   =========================================================
   Cara mendapatkan: Firebase Console > Project Settings >
   scroll ke "Your apps" > Web app > SDK setup and configuration.
   Lihat file PANDUAN-SETUP.md untuk langkah lengkap.
*/
const firebaseConfig = {
  apiKey: "AIzaSyAmkwpGeqhRdMWrQPa_ahW_gJ27cQ4DZIo",
  authDomain: "buku-tamu-digital-4df8b.firebaseapp.com",
  projectId: "buku-tamu-digital-4df8b",
  storageBucket: "buku-tamu-digital-4df8b.firebasestorage.app",
  messagingSenderId: "308793150877",
  appId: "1:308793150877:web:f05f75dbe7b4619b9ab374"
};

const CONFIG_BELUM_DIISI = firebaseConfig.apiKey === "GANTI_DENGAN_API_KEY";

if(CONFIG_BELUM_DIISI){
  document.getElementById('configWarning').innerHTML = `
    <div class="config-warning">
      ⚠️ <strong>Firebase config belum diisi.</strong> Buka file ini, cari bagian
      <code>firebaseConfig</code> di dalam tag &lt;script&gt;, lalu ganti dengan config
      proyek Firebase Anda sendiri. Lihat <strong>PANDUAN-SETUP.md</strong> untuk langkah lengkapnya.
      Sebelum diisi, aplikasi tidak bisa terhubung ke database.
    </div>`;
}

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Domain email dummy untuk akun user & adm utama (karena Firebase Auth butuh format email)
const EMAIL_DOMAIN = "@tamu-undangan.local";

// ================= STATE =================
let currentUser = null;   // firebase auth user object
let currentRole = null;   // 'adm_utama' | 'akun_user' | 'adm_sementara'
let currentUserData = null; // dokumen firestore terkait
let admSementaraSession = null; // {tokenId, terikat_ke_userId, expired_at}
let timerInterval = null;

const app = document.getElementById('app');
const appHeader = document.getElementById('appHeader');
const whoAmI = document.getElementById('whoAmI');

document.getElementById('btnLogout').onclick = async () => {
  clearInterval(timerInterval);
  if(syncTimer) clearInterval(syncTimer);
  if(currentRole === 'adm_sementara' && inputQueue.length > 0){
    await sinkronKeDatabase(true);
  }
  admSementaraSession = null;
  sessionStorage.removeItem('adm_sementara_token');
  auth.signOut().then(()=> renderLogin());
};

// Penangkap error global — supaya kegagalan tidak lagi "diam saja" tanpa pesan
window.addEventListener('error', (e) => {
  console.error('Error:', e.message);
  const c = document.getElementById('loginCard') || document.querySelector('.card');
  if(c) showMsg(c, 'Terjadi masalah teknis: ' + e.message + '. Coba matikan Brave Shields untuk situs ini, atau pakai browser Chrome.');
});
window.addEventListener('unhandledrejection', (e) => {
  console.error('Promise error:', e.reason);
  const c = document.getElementById('loginCard') || document.querySelector('.card');
  const pesan = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  if(c) showMsg(c, 'Gagal terhubung ke server: ' + pesan + '. Coba matikan Brave Shields untuk situs ini, atau pakai browser Chrome.');
});

// ================= UTIL =================
function fmtRp(n){
  n = Number(n||0);
  return "Rp " + n.toLocaleString('id-ID');
}
function fmtWaktu(ts){
  if(!ts) return '-';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString('id-ID', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function randomToken(len=8){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';
  for(let i=0;i<len;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function showMsg(container, text, type='error'){
  const el = document.createElement('div');
  el.className = 'msg ' + type;
  el.textContent = text;
  container.prepend(el);
  setTimeout(()=>el.remove(), 5000);
}

// ================= ROUTING / INIT =================
auth.onAuthStateChanged(async (user) => {
  clearInterval(timerInterval);

  // Kalau URL bawa kode akses QR (?akses=...) tapi browser ini masih login
  // sebagai sesi lain (Akun User, ADM Utama, atau token ADM Sementara yang
  // beda) — paksa logout dulu. Firebase Auth menyimpan sesi login secara
  // persisten, jadi tanpa ini, scan QR akan diam-diam mengabaikan kode akses
  // dan malah menampilkan sesi lama (inilah penyebab layar "Akun User: test"
  // kosong yang muncul waktu scan QR).
  const urlParamsAwal = new URLSearchParams(window.location.search);
  const aksesParamAwal = urlParamsAwal.get('akses');
  if(aksesParamAwal && user && !(user.isAnonymous && sessionStorage.getItem('adm_sementara_token') === aksesParamAwal)){
    await auth.signOut();
    return; // signOut akan memicu onAuthStateChanged lagi dengan user=null
  }

  if(!user){
    currentUser = null; currentRole = null; currentUserData = null;
    appHeader.style.display = 'none';
    renderLogin();
    return;
  }
  currentUser = user;

  // User anonim (hasil scan QR) tidak mungkin punya dokumen di adm_utama atau
  // akun_user, jadi langsung cek sesi token dulu — ini menghemat 2 pembacaan
  // Firestore yang pasti kosong dan cuma memperlambat proses scan QR.
  if(user.isAnonymous){
    const savedToken = sessionStorage.getItem('adm_sementara_token');
    if(savedToken){
      const tokenDoc = await db.collection('qr_tokens').doc(savedToken).get();
      if(tokenDoc.exists && tokenDoc.data().assigned_uid === user.uid){
        const data = tokenDoc.data();
        const expired = data.expired_at.toDate() < new Date();
        if(!expired && data.status === 'aktif'){
          currentRole = 'adm_sementara';
          admSementaraSession = {tokenId: savedToken, ...data};
          appHeader.style.display = 'flex';
          whoAmI.textContent = 'ADM Sementara (sesi 36 jam)';
          renderAdmSementara();
          return;
        }
      }
    }
    // user anonim tanpa sesi valid -> tampilkan layar scan/masukkan kode
    appHeader.style.display = 'none';
    renderLogin();
    return;
  }

  // cek apakah dia ADM Utama
  const admDoc = await db.collection('adm_utama').doc(user.uid).get();
  if(admDoc.exists){
    currentRole = 'adm_utama';
    currentUserData = admDoc.data();
    appHeader.style.display = 'flex';
    whoAmI.textContent = 'ADM Utama';
    renderAdmUtama();
    return;
  }

  // cek apakah dia Akun User
  const userDoc = await db.collection('akun_user').doc(user.uid).get();
  if(userDoc.exists){
    currentRole = 'akun_user';
    currentUserData = userDoc.data();
    appHeader.style.display = 'flex';
    whoAmI.textContent = 'Akun User: ' + userDoc.data().username;
    renderAkunUser();
    return;
  }

  // login berhasil tapi tidak cocok role manapun (kasus tidak wajar) -> ke layar login
  appHeader.style.display = 'none';
  renderLogin();
});

function renderLogin(){
  clearInterval(timerInterval);
  const urlParams = new URLSearchParams(window.location.search);
  const aksesParam = urlParams.get('akses') || '';

  app.innerHTML = `
    <div class="center">
      <div class="login-box">
        <div class="tab-bar">
          <button id="tabUser" class="active">Akun User</button>
          <button id="tabAdm">ADM Utama</button>
          <button id="tabQr">ADM Sementara (QR)</button>
        </div>
        <div id="loginCard" class="card"></div>
      </div>
    </div>
  `;
  document.getElementById('tabUser').onclick = () => switchTab('user');
  document.getElementById('tabAdm').onclick = () => switchTab('adm');
  document.getElementById('tabQr').onclick = () => switchTab('qr');

  function switchTab(which){
    document.getElementById('tabUser').classList.toggle('active', which==='user');
    document.getElementById('tabAdm').classList.toggle('active', which==='adm');
    document.getElementById('tabQr').classList.toggle('active', which==='qr');
    if(which==='user') renderLoginUser();
    if(which==='adm') renderLoginAdm();
    if(which==='qr') renderLoginQr();
  }

  if(aksesParam){
    switchTab('qr');
    setTimeout(()=>{
      const inp = document.getElementById('qrTokenInput');
      const btn = document.getElementById('qrSubmit');
      if(inp) inp.value = aksesParam;
      if(btn) btn.click(); // langsung proses, sesuai janji "scan QR akan membuka halaman ini otomatis"
    }, 0);
  } else {
    renderLoginUser();
  }
}

function renderLoginUser(){
  const card = document.getElementById('loginCard');
  card.innerHTML = `
    <h2>Login Akun User</h2>
    <p class="muted">Untuk melihat &amp; melengkapi daftar tamu undangan Anda.</p>
    <label>Username</label>
    <input type="text" id="luUsername" autocomplete="username">
    <label>Password</label>
    <input type="password" id="luPassword" autocomplete="current-password">
    <button class="btn-primary" style="margin-top:14px;width:100%;" id="luSubmit">Masuk</button>
  `;
  document.getElementById('luSubmit').onclick = async () => {

    const p = document.getElementById('luPassword').value;
    if(!u || !p) return showMsg(card, 'Username dan password wajib diisi.');

      await auth.signInWithEmailAndPassword(u.toLowerCase() + EMAIL_DOMAIN, p);
    }catch(e){
      showMsg(card, 'Login gagal: username atau password salah.');

    }
  };
}

function renderLoginAdm(){
  const card = document.getElementById('loginCard');
  card.innerHTML = `
    <h2>Login ADM Utama</h2>
    <label>Email</label>
    <input type="text" id="laEmail" autocomplete="username">
    <label>Password</label>
    <input type="password" id="laPassword" autocomplete="current-password">
    <button class="btn-primary" style="margin-top:14px;width:100%;" id="laSubmit">Masuk</button>
    <p class="muted" style="margin-top:12px;">Akun ADM Utama dibuat manual sekali lewat Firebase Console. Lihat PANDUAN-SETUP.md.</p>
  `;
  document.getElementById('laSubmit').onclick = async () => {

    const p = document.getElementById('laPassword').value;
    if(!e || !p) return showMsg(card, 'Email dan password wajib diisi.');

    }catch(err){
      showMsg(card, 'Login gagal: ' + err.message);

    }
  };
}

function renderLoginQr(){
  const card = document.getElementById('loginCard');
  card.innerHTML = `
    <h2>Akses ADM Sementara</h2>
    <p class="muted">Scan QR yang diberikan ADM Utama dengan kamera/aplikasi scan QR ponsel Anda —
    ini akan membuka halaman ini otomatis. Atau masukkan kode manual di bawah.</p>
    <label>Kode Akses</label>
    <input type="text" id="qrTokenInput" placeholder="Contoh: 7K2P9QRT" style="text-transform:uppercase;">
    <button class="btn-primary" style="margin-top:14px;width:100%;" id="qrSubmit">Masuk dengan Kode</button>
  `;
  document.getElementById('qrSubmit').onclick = async () => {
    const token = document.getElementById('qrTokenInput').value.trim().toUpperCase();
    if(!token) return showMsg(card, 'Masukkan kode akses.');
    try{
      // sign in anonim DULU — security rules mewajibkan sudah login sebelum baca qr_tokens
      let anonUser = auth.currentUser;
      if(!anonUser || !anonUser.isAnonymous){
        const cred = await auth.signInAnonymously();
        anonUser = cred.user;
      }
      const tokenRef = db.collection('qr_tokens').doc(token);
      const tokenSnap = await tokenRef.get();
      if(!tokenSnap.exists) return showMsg(card, 'Kode akses tidak ditemukan.');
      const data = tokenSnap.data();
      if(data.status !== 'aktif' || data.expired_at.toDate() < new Date()){
        return showMsg(card, 'Kode akses sudah kedaluwarsa (lebih dari 36 jam) atau sudah dinonaktifkan.');
      }
      // klaim token dalam transaction (1 QR hanya utk 1 ADM sementara)
      await db.runTransaction(async (tx) => {
        const fresh = await tx.get(tokenRef);
        const d = fresh.data();
        if(d.assigned_uid && d.assigned_uid !== anonUser.uid){
          throw new Error('Kode akses ini sudah dipakai oleh perangkat lain.');
        }
        if(!d.assigned_uid){
          tx.update(tokenRef, {assigned_uid: anonUser.uid});
        }
        // buat/perbarui mapping akses (dipakai oleh security rules)
        const aksesRef = db.collection('adm_sementara_akses').doc(anonUser.uid);
        tx.set(aksesRef, {
          terikat_ke_userId: d.terikat_ke_userId,
          token_id: token,
          expired_at: d.expired_at
        });
      });
      sessionStorage.setItem('adm_sementara_token', token);
      // Langsung lanjut ke tampilan ADM Sementara tanpa reload penuh halaman —
      // location.reload() sebelumnya memaksa semua script (termasuk Firebase SDK)
      // diunduh & dijalankan ulang dari nol, inilah salah satu penyebab utama
      // proses scan QR terasa berat.
      currentRole = 'adm_sementara';
      admSementaraSession = {tokenId: token, ...data, assigned_uid: anonUser.uid};
      appHeader.style.display = 'flex';
      whoAmI.textContent = 'ADM Sementara (sesi 36 jam)';
      renderAdmSementara();
    }catch(e){
      showMsg(card, e.message || 'Gagal memproses kode akses.');
    }
  };
}

// Hapus log ADM Sementara yang sudah lewat 48 jam (pengganti TTL policy Firestore,
// supaya tidak perlu billing account). Dijalankan tiap ADM Utama buka aplikasi.
async function bersihkanLogKedaluwarsa(){
  try{
    const now = firebase.firestore.Timestamp.now();
    const snap = await db.collection('log_adm_sementara')
      .where('ttl_hapus_pada','<=', now).limit(200).get();
    if(snap.empty) return;
    const batch = db.batch();
    snap.forEach(doc => batch.delete(doc.ref));
    await batch.commit();
  }catch(e){
    console.warn('Gagal membersihkan log kedaluwarsa:', e.message);
  }
}

// ================= ADM UTAMA =================
async function renderAdmUtama(){
  bersihkanLogKedaluwarsa();

  app.innerHTML = `
    <div class="card">
      <h2>Buat Akun User Baru</h2>
      <div class="row">
        <div>
          <label>Username</label>
          <input type="text" id="auUsername" placeholder="mis. keluarga-budi">
        </div>
        <div>
          <label>Password</label>
          <input type="text" id="auPassword" placeholder="min. 6 karakter">
        </div>
      </div>
      <button class="btn-primary" id="auSubmit" style="margin-top:12px;">Buat Akun</button>
    </div>

      const secondaryAuth = secondaryApp.auth();
      const cred = await secondaryAuth.createUserWithEmailAndPassword(username + EMAIL_DOMAIN, password);

        kuota_total: 0,
        kuota_terpakai: 0,

      });

      loadAkunUserList();

// Lazy-load qrcode.min.js — hanya dibutuhkan ADM Utama saat membuat/menampilkan
// QR. ADM Sementara (yang scan QR) tidak pernah memanggil ini sama sekali,
// jadi mereka tidak perlu mengunduh library ini.
let qrCodeLibPromise = null;
function muatLibraryQrCode(){
  if(window.QRCode) return Promise.resolve();
  if(!qrCodeLibPromise){
    qrCodeLibPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
      s.onload = resolve;
      s.onerror = () => reject(new Error('Gagal memuat library QR Code.'));
      document.head.appendChild(s);
    });
  }
  return qrCodeLibPromise;
}

async function buatQrToken(userId){
  const namaPetugas = prompt('Nama petugas ADM Sementara (untuk catatan log):');
  if(namaPetugas === null || namaPetugas.trim() === '') return;
  const tokenId = randomToken(8);
  const expiredAt = new Date(Date.now() + 36*60*60*1000);
  await db.collection('qr_tokens').doc(tokenId).set({
    terikat_ke_userId: userId,
    nama_petugas: namaPetugas.trim(),
    dibuat_at: firebase.firestore.FieldValue.serverTimestamp(),
    expired_at: firebase.firestore.Timestamp.fromDate(expiredAt),
    assigned_uid: null,
    status: 'aktif',
    settled: false,
    dibuat_oleh: currentUser.uid
  });

  await muatLibraryQrCode();

  const qrArea = document.getElementById('qrArea');
  qrArea.style.display = 'block';
  const linkUrl = window.location.origin + window.location.pathname + '?akses=' + tokenId;
  qrArea.innerHTML = `
    <h2>QR ADM Sementara Baru</h2>
    <div class="qr-box">
      <div id="qrcanvas"></div>
      <div class="token-code">${tokenId}</div>
      <p class="muted">Berlaku 36 jam sejak sekarang (sampai ${fmtWaktu(firebase.firestore.Timestamp.fromDate(expiredAt))}).</p>
      <p class="muted">Scan QR ini, atau buka tautan: <br><code style="word-break:break-all;">${linkUrl}</code></p>
    </div>
  `;
  new QRCode(document.getElementById('qrcanvas'), {
    text: linkUrl, width: 200, height: 200
  });

  loadTokenList(userId);
}


async function loadTokenList(userId){
  const el = document.getElementById('tokenList');
  const snap = await db.collection('qr_tokens')
    .where('terikat_ke_userId','==',userId)
    .orderBy('dibuat_at','desc').limit(20).get();
  if(snap.empty){
    el.innerHTML = '<p class="empty">Belum ada QR yang dibuat untuk akun ini.</p>';
    return;
  }
  let rows = '';
  snap.forEach(doc => {
    const d = doc.data();
    const expired = d.expired_at.toDate() < new Date();
    const statusLabel = expired ? 'Kedaluwarsa' : (d.assigned_uid ? 'Aktif dipakai' : 'Menunggu scan');
    const badgeClass = expired ? 'expired' : (d.assigned_uid ? 'aktif' : 'belum');
    const bisaDibuka = !expired; // QR yang belum kedaluwarsa bisa dibuka lagi
    rows += `
      <tr ${bisaDibuka?`onclick="tampilkanUlangQr('${doc.id}')" style="cursor:pointer;"`:''}>
        <td>
          <strong style="font-size:15px;color:var(--ink-2);">${d.nama_petugas||'(tanpa nama)'}</strong><br>
          <span class="token-code" style="font-size:12px;">${doc.id}</span>
        </td>
        <td>${fmtWaktu(d.expired_at)}</td>
        <td><span class="badge ${badgeClass}">${statusLabel}</span></td>
      </tr>`;
  });
  el.innerHTML = `
    <table>
      <thead><tr><th>Petugas / Kode</th><th>Berlaku s/d</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="muted" style="margin-top:8px;font-size:11px;">Tap baris yang masih berlaku untuk menampilkan ulang QR-nya.</p>`;
}

async function tampilkanUlangQr(tokenId){
  const doc = await db.collection('qr_tokens').doc(tokenId).get();
  const d = doc.data();
  await muatLibraryQrCode();
  const qrArea = document.getElementById('qrArea');
  if(!qrArea) return;
  qrArea.style.display = 'block';
  qrArea.scrollIntoView({behavior:'smooth'});
  const linkUrl = window.location.origin + window.location.pathname + '?akses=' + tokenId;
  qrArea.innerHTML = `
    <h2>QR — ${d.nama_petugas||'(tanpa nama)'}</h2>
    <div class="qr-box">
      <div id="qrcanvas"></div>
      <div class="token-code">${tokenId}</div>
      <p class="muted">Berlaku sampai ${fmtWaktu(d.expired_at)}.</p>
      <p class="muted">Scan QR ini, atau buka tautan: <br><code style="word-break:break-all;">${linkUrl}</code></p>
    </div>
  `;
  new QRCode(document.getElementById('qrcanvas'), {
    text: linkUrl, width: 200, height: 200
  });
}
window.tampilkanUlangQr = tampilkanUlangQr;

  const ref = db.collection('akun_user').doc(userId).collection('tamu').doc(tamuId);

  await ref.delete();

      kuota_terpakai: firebase.firestore.FieldValue.increment(-1)
    });

// settle kuota otomatis: cek token yang sudah expired tapi belum "settled" utk akun ini
async function settleKuotaJikaAda(userId){
  const snap = await db.collection('qr_tokens')
    .where('terikat_ke_userId','==',userId)
    .where('settled','==', false).get();
  const now = new Date();
  for(const doc of snap.docs){
    const d = doc.data();
    if(d.expired_at.toDate() < now){
      const tamuCount = (await db.collection('akun_user').doc(userId).collection('tamu').get()).size;
      await db.collection('akun_user').doc(userId).update({
        kuota_total: tamuCount + 500,
        kuota_terpakai: tamuCount
      });
      await doc.ref.update({ settled: true, status: 'expired' });
    }
  }
}

// ================= ADM SEMENTARA =================
let inputQueue = [];       // data yang belum tersinkron ke server
let daftarAlamat = [];     // untuk saran alamat (datalist)
let syncTimer = null;
let sedangMenyimpan = false;

function localStorageKey(){
  return 'tamu_pending_' + admSementaraSession.tokenId;
}
function muatQueueDariLocal(){
  try{
    const raw = localStorage.getItem(localStorageKey());
    inputQueue = raw ? JSON.parse(raw) : [];
  }catch(e){ inputQueue = []; }
}
function simpanQueueKeLocal(){
  try{ localStorage.setItem(localStorageKey(), JSON.stringify(inputQueue)); }catch(e){}
}

function formatRupiahLive(el){
  el.addEventListener('input', () => {
    let digits = el.value.replace(/[^0-9]/g,'');
    if(!digits){ el.value=''; return; }
    el.value = 'Rp' + parseInt(digits,10).toLocaleString('id-ID');
  });
}
function ambilAngkaDariRupiah(str){
  return parseInt((str||'').replace(/[^0-9]/g,''),10) || 0;
}

async function renderAdmSementara(){
  muatQueueDariLocal();
  const userDoc = await db.collection('akun_user').doc(admSementaraSession.terikat_ke_userId).get();
  const namaAkun = userDoc.data().username;

  app.innerHTML = `
    <div class="card">
      <h2>Input Data Tamu — ${namaAkun}</h2>
      <p class="muted">Petugas: <strong>${admSementaraSession.nama_petugas||'-'}</strong> • <span class="timer" id="sesiTimer"></span></p>
    </div>

    <div class="card">
      <h2>Tambah Tamu</h2>
      <div class="row">
        <div><label>Nama</label><input type="text" id="asNama"></div>
        <div><label>Alamat</label>
          <input type="text" id="asAlamat" list="daftarAlamatList" autocomplete="off">
          <datalist id="daftarAlamatList"></datalist>
        </div>
      </div>
      <div class="row">
        <div><label>Nominal Sumbangan</label><input type="text" id="asRp" inputmode="numeric" placeholder="Rp0"></div>
        <div><label>Status</label>
          <select id="asStatus">
            <option value="belum">Belum kembali</option>
            <option value="sudah">Sudah kembali</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" id="asSubmit" style="margin-top:12px;">Simpan &amp; Lanjut Input</button>
      <div class="sync-bar">
        <p class="muted" id="asCounter" style="margin:0;"></p>
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="muted" id="syncStatus" style="font-size:12px;"></span>
          <button class="btn-outline btn-sm" id="syncNowBtn">Update Database</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Input Terakhir <span class="muted" style="font-size:12px;font-weight:400;">(tap baris untuk edit)</span></h2>
      <div id="asRecent"></div>
    </div>
  `;

  formatRupiahLive(document.getElementById('asRp'));
  document.getElementById('syncNowBtn').onclick = () => sinkronKeDatabase(true);

  let counterEl = document.getElementById('asCounter');
  counterEl.textContent = `${inputQueue.length} menunggu sinkron.`;

  document.getElementById('asSubmit').onclick = async () => {
    if(sedangMenyimpan) return; // cegah double-klik
    const nama = document.getElementById('asNama').value.trim();
    const alamat = document.getElementById('asAlamat').value.trim();
    const rp = ambilAngkaDariRupiah(document.getElementById('asRp').value);
    const status = document.getElementById('asStatus').value;
    if(!nama) return showMsg(app.querySelector('.card'), 'Nama wajib diisi.');

    sedangMenyimpan = true;
    const btn = document.getElementById('asSubmit');
    btn.disabled = true;

    inputQueue.push({
      tempId: 'p' + Date.now() + Math.random().toString(36).slice(2,6),
      nama, alamat, rp, status,
      waktu_lokal: Date.now()
    });
    simpanQueueKeLocal();
    if(!daftarAlamat.includes(alamat) && alamat){
      daftarAlamat.push(alamat);
      renderDaftarAlamatOptions();
      simpanAlamatKeCache();
    }

    document.getElementById('asNama').value='';
    document.getElementById('asAlamat').value='';
    document.getElementById('asRp').value='';
    document.getElementById('asStatus').value='belum';
    document.getElementById('asNama').focus();

    counterEl.textContent = `${inputQueue.length} menunggu sinkron.`;
    renderAsList();

    setTimeout(()=>{ sedangMenyimpan = false; btn.disabled = false; }, 400); // jeda anti double-klik

    if(inputQueue.length >= 15){
      sinkronKeDatabase();
    }
  };

  renderAsList();
  muatSaranAlamat();
  muatSyncedRowsCache().then(renderAsList);

  // auto-sync berkala tiap 1 menit, jaga-jaga walau belum sampai 15 data
  if(syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(() => {
    if(inputQueue.length > 0) sinkronKeDatabase();
  }, 60*1000);

  // countdown timer sesi
  const expiredAt = admSementaraSession.expired_at.toDate();
  const timerEl = document.getElementById('sesiTimer');
  timerInterval = setInterval(() => {
    const diff = expiredAt - new Date();
    if(diff <= 0){
      timerEl.textContent = 'Sesi telah berakhir.';
      clearInterval(timerInterval);
      clearInterval(syncTimer);
      sinkronKeDatabase(true).finally(() => {
        setTimeout(()=>{ auth.signOut(); }, 1000);
      });
      return;
    }
    const h = Math.floor(diff/3600000);
    const m = Math.floor((diff%3600000)/60000);
    const s = Math.floor((diff%60000)/1000);
    timerEl.textContent = `Sisa waktu sesi: ${h}j ${m}m ${s}d`;
  }, 1000);
}

// Catatan performa: sebelumnya fungsi ini menarik 300 dokumen dari Firestore
// setiap kali ADM Sementara membuka halaman — inilah salah satu penyebab
// aplikasi terasa berat. ADM Sementara cukup bertugas menulis data secepat
// mungkin, jadi saran alamat cukup diambil dari cache ringan di perangkat ini
// (localStorage), bukan query server setiap saat.
function alamatCacheKey(){
  return 'tamu_alamat_cache_' + admSementaraSession.terikat_ke_userId;
}
function muatSaranAlamat(){
  try{
    const raw = localStorage.getItem(alamatCacheKey());
    const cache = raw ? JSON.parse(raw) : [];
    daftarAlamat = Array.from(new Set([...daftarAlamat, ...cache]));
    renderDaftarAlamatOptions();
  }catch(e){ /* abaikan, tidak kritis */ }
}
function renderDaftarAlamatOptions(){
  const listEl = document.getElementById('daftarAlamatList');
  if(listEl){
    listEl.innerHTML = daftarAlamat.map(a => `<option value="${a.replace(/"/g,'&quot;')}">`).join('');
  }
}
function simpanAlamatKeCache(){
  try{ localStorage.setItem(alamatCacheKey(), JSON.stringify(daftarAlamat.slice(-100))); }catch(e){}
}

async function sinkronKeDatabase(manual){
  const statusEl = document.getElementById('syncStatus');
  if(inputQueue.length === 0){
    if(manual && statusEl) statusEl.textContent = 'Tidak ada data baru.';
    return;
  }
  if(statusEl) statusEl.textContent = 'Menyinkron...';
  const userId = admSementaraSession.terikat_ke_userId;
  const batchItems = inputQueue.slice(0, 400); // batas aman per batch Firestore
  try{
    const batch = db.batch();
    batchItems.forEach(item => {
      const tamuRef = db.collection('akun_user').doc(userId).collection('tamu').doc();
      batch.set(tamuRef, {
        nama: item.nama, alamat: item.alamat, rp: item.rp, status: item.status,
        permanen: false,
        dicatat_oleh: 'adm_sementara',
        dicatat_pada: firebase.firestore.FieldValue.serverTimestamp()
      });
      const logRef = db.collection('log_adm_sementara').doc();
      batch.set(logRef, {
        token_id: admSementaraSession.tokenId,
        nama_petugas: admSementaraSession.nama_petugas || '-',
        terikat_ke_userId: userId,
        tamu_id: tamuRef.id,
        aksi: 'tambah',
        nama_tamu: item.nama,
        waktu: firebase.firestore.FieldValue.serverTimestamp(),
        ttl_hapus_pada: firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 48*60*60*1000))
      });
    });
    await batch.commit();
    // hapus yang sudah tersinkron dari antrian lokal
    const idSynced = new Set(batchItems.map(i => i.tempId));
    inputQueue = inputQueue.filter(i => !idSynced.has(i.tempId));
    simpanQueueKeLocal();
    if(statusEl) statusEl.textContent = `Tersinkron ${batchItems.length} data.`;
    const counterEl = document.getElementById('asCounter');
    if(counterEl) counterEl.textContent = `${inputQueue.length} menunggu sinkron.`;
    muatSyncedRowsCache().then(renderAsList);
  }catch(e){
    if(statusEl) statusEl.textContent = 'Gagal sinkron: ' + e.message;
    console.error('Sinkron gagal:', e);
  }
}

// Cache ringan hasil terakhir yang sudah tersinkron ke server. Diisi sekali saat
// halaman dibuka dan tiap kali sinkron berhasil — BUKAN setiap kali baris ini
// dirender, supaya input data tetap terasa instan tanpa menunggu jaringan.
let syncedRowsCache = [];

async function muatSyncedRowsCache(){
  try{
    const userId = admSementaraSession.terikat_ke_userId;
    const snap = await db.collection('akun_user').doc(userId).collection('tamu')
      .where('dicatat_oleh','==','adm_sementara')
      .orderBy('dicatat_pada','desc').limit(20).get();
    syncedRowsCache = [];
    snap.forEach(doc => syncedRowsCache.push({id: doc.id, ...doc.data(), _synced:true}));
  }catch(e){ /* index mungkin belum siap, abaikan — tidak menghalangi input */ }
}

function renderAsList(){
  const el = document.getElementById('asRecent');
  if(!el) return;
  const lokalRows = [...inputQueue].reverse().map(i => ({...i, _synced:false}));
  const semua = [...lokalRows, ...syncedRowsCache];

  if(semua.length === 0){ el.innerHTML = '<p class="empty">Belum ada input.</p>'; return; }

  let rows = '';
  semua.forEach(t => {
    const idAttr = t._synced ? `'firestore','${t.id}'` : `'lokal','${t.tempId}'`;
    rows += `
      <tr onclick="editTamuAdmSementara(${idAttr})" style="cursor:pointer;">
        <td class="col-nama">${t.nama} ${t._synced?'':'<span class="badge lokal" style="margin-left:4px;">Lokal</span>'}</td>
        <td class="col-alamat">${t.alamat||'-'}</td>
        <td class="col-rp">${fmtRp(t.rp)}</td>
      </tr>`;
  });
  el.innerHTML = `
    <div class="table-scroll">
      <table>
        <thead><tr><th class="col-nama">Nama</th><th class="col-alamat">Alamat</th><th class="col-rp-h">Sumbangan</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

async function editTamuAdmSementara(tipe, id){
  if(tipe === 'lokal'){
    const item = inputQueue.find(i => i.tempId === id);
    if(!item) return;
    const nama = prompt('Nama:', item.nama); if(nama===null) return;
    const alamat = prompt('Alamat:', item.alamat||''); if(alamat===null) return;
    const rp = prompt('Nominal sumbangan (angka saja):', item.rp||0); if(rp===null) return;
    const sudahKembali = confirm('Status sudah dikembalikan? OK = Sudah, Cancel = Belum');
    item.nama = nama; item.alamat = alamat; item.rp = parseInt(rp)||0;
    item.status = sudahKembali ? 'sudah' : 'belum';
    simpanQueueKeLocal();
    renderAsList();
  } else {
    const userId = admSementaraSession.terikat_ke_userId;
    const ref = db.collection('akun_user').doc(userId).collection('tamu').doc(id);
    const doc = await ref.get();
    const t = doc.data();
    const nama = prompt('Nama:', t.nama); if(nama===null) return;
    const alamat = prompt('Alamat:', t.alamat||''); if(alamat===null) return;
    const rp = prompt('Nominal sumbangan (angka saja):', t.rp||0); if(rp===null) return;
    const sudahKembali = confirm('Status sudah dikembalikan? OK = Sudah, Cancel = Belum');
    const rpVal = parseInt(rp)||0;
    const statusVal = sudahKembali?'sudah':'belum';
    await ref.update({ nama, alamat, rp: rpVal, status: statusVal });
    const cached = syncedRowsCache.find(r => r.id === id);
    if(cached){ cached.nama = nama; cached.alamat = alamat; cached.rp = rpVal; cached.status = statusVal; }
    renderAsList();
  }
}
window.editTamuAdmSementara = editTamuAdmSementara;

window.addEventListener('beforeunload', () => {
  if(currentRole === 'adm_sementara' && inputQueue.length > 0){
    sinkronKeDatabase(true);
  }
});

}); // tutup document.addEventListener('DOMContentLoaded', ...)
</script>
